version: "2"
linters:
  default: all
  disable:
    - bodyclose                # this should all be handled by httpclient, but linter isn't smart enough to detect - enable case-by-case later?
    - depguard                 # annoying - must maintain a constant whitelist of import-able packages
    - err113                   # annoying - no dynamic errors, forces named errors or wrapping errors
    - exhaustruct              # annoying - forces full struct initializations
    - exhaustruct_v5           # same, for the v5 fork that `default: all` enables since v2.12
    - godot                    # annoying - ending all comments with periods
    - intrange                 # annoying - sometimes int ranges are okay, but forcing them doesn't always improve code clarity
    - mnd                      # annoying - magic numbers more annoying to alert on than deal with
    - tagalign                 # forces you to use the tool to do non-standard alignment
    - tagliatelle              # annoying - enforces "no snake case" in JSON tags on things we don't control
    - noinlineerr              # Disabled during v2 conversion - new linting errors
    - funcorder                # Disabled during v2 conversion - new linting errors
    - embeddedstructfieldcheck # Disabled during v2 conversion - new linting errors
    - wsl                      # Deprecated and replaced with wsl_v5 since v2.2.0
    - modernize                # new in v2.12 via `default: all` - adopt deliberately, not on a version bump
  settings:
    dupl:
      threshold: 1000
    goconst:
      ignore-tests: true       # v2.13 started scanning _test.go; table-test literals are not constants
      ignore-map-keys: true    # map/struct keys are data, not constants to extract
    govet:
      disable:
        - inline               # new analyzer in v2.13 - flags non-inlined stdlib constants
    forbidigo:
      forbid:
        - pattern: ^print.*$
    gosec:
      config:
        G302: "0644"
        G306: "0644"
    lll:
      line-length: 150
    nlreturn:
      block-size: 2
    perfsprint:
      errorf: false       # annoying - forces errors.New() when no format strings in fmt.Errorf call
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    rules:
      - path: (^|/)mock\.go$
        linters:
          - goconst   # generated mocks: fixture strings are data, not constants
      - path: (^|/)(test|testhelper)/
        linters:
          - goconst   # test helper packages: same reasoning
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - goimports
    #- gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
